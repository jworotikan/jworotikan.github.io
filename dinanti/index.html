<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dinanti — Pilih Versi Mockup</title>
  <link rel="icon" type="image/png" href="V2/assets/img/logo/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #FBF8F5; --text: #1E293B; --muted: #64748B; --primary: #E07A5F; --line: #EAE2DB; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: "Plus Jakarta Sans", system-ui, sans-serif; padding: 24px 16px; }
    .wrap { max-width: 760px; width: 100%; text-align: center; }
    img.logo { height: 120px; margin-bottom: 18px; }
    h1 { font-family: Fraunces, serif; font-weight: 400; font-size: clamp(26px, 4vw, 36px); margin: 0 0 6px; }
    p { color: var(--muted); margin: 0 0 32px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    a.card { display: block; text-decoration: none; color: inherit; background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 26px 22px; text-align: left; transition: transform .25s, box-shadow .25s; }
    a.card:hover { transform: translateY(-4px); box-shadow: 0 20px 50px rgba(30,41,59,.1); }
    .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #F5E6E0; color: #C75D41; }
    .tag.v2 { background: #1E293B; color: #fff; }
    h2 { font-family: Fraunces, serif; font-weight: 600; font-size: 22px; margin: 12px 0 6px; }
    .card span.d { color: var(--muted); font-size: 14px; line-height: 1.5; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="V2/assets/img/logo/logo-stacked.png" alt="Dinanti Klinik Utama">
    <h1>Mockup Website Klinik Dinanti</h1>
    <p>Pilih versi yang ingin dilihat.</p>
    <div class="grid">
      <a class="card" href="V1/index.html"><span class="tag">V1</span><h2>Versi Statis</h2><span class="d">Layout simpel &amp; bersih, minim animasi.</span></a>
      <a class="card" href="V2/index.html"><span class="tag v2">V2 · Interaktif</span><h2>Versi Animasi</h2><span class="d">Preloader, smooth scroll, parallax, scroll-story Two to Tango, kursor kustom, efek 3D &amp; marquee.</span></a>
    </div>
  </div>
</body>
</html>
